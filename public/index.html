<style>
/* Layout: full-bleed 3D view. Instruments sit along the bottom edge like a coaming panel, warnings top-centre, one modal card for menu / pause / crash. Single committed look (daylight sky, amber instruments). */
:root{
  --bg:#0c1a22;
  --panel:rgba(10,22,30,.7);
  --line:rgba(214,232,238,.22);
  --text:#e8f1f3;
  --muted:#93acb4;
  --accent:#ffb347;
  --accent-ink:#1a1205;
  --warn:#ff5d4d;
  --ok:#74d6a4;
  --font-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-display);font-size:15px;overflow:hidden}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}

#hurt{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;box-shadow:inset 0 0 130px 36px rgba(255,60,40,.6)}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,0) 56%,rgba(3,9,15,.36) 100%)}
#hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;
  padding-block:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.top>*{min-width:0}
.bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.mini{padding:7px 11px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.mini b{font-family:var(--font-mono);font-weight:700;color:var(--text);letter-spacing:0;font-variant-numeric:tabular-nums}
.warn{align-self:flex-start;padding:8px 18px;border-radius:6px;background:var(--warn);color:#fff;font-weight:700;font-size:20px;letter-spacing:.2em}
.warn.blink{animation:blink .5s steps(2,start) infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.warn.blink{animation:none}}

.reads{display:flex;gap:18px;padding:10px 14px}
.read{display:flex;flex-direction:column;min-width:58px}
.read b{font-family:var(--font-mono);font-size:26px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.read span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:5px}
#ai{width:124px;height:124px;border-radius:50%;padding:0}
.gauge{display:flex;gap:12px;align-items:flex-end;padding:10px 12px}
.bar{width:14px;height:84px;border:1px solid var(--line);border-radius:3px;display:flex;align-items:flex-end;background:rgba(255,255,255,.05);overflow:hidden}
.bar i{display:block;width:100%;background:var(--accent);height:0}
.gread{display:flex;flex-direction:column;gap:6px;min-width:64px}
.gread div{display:flex;justify-content:space-between;gap:10px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.gread b{font-family:var(--font-mono);font-size:13px;color:var(--text);letter-spacing:0;font-variant-numeric:tabular-nums}
.lamp.on b{color:var(--accent)}

#overlay{position:absolute;inset:0;display:flex;overflow:auto;background:rgba(7,16,22,.58);
  padding-block:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{width:min(680px,100%);margin:auto;background:rgba(9,20,27,.92);border:1px solid var(--line);border-radius:10px;padding:22px clamp(16px,4vw,28px);display:flex;flex-direction:column;gap:14px}
.card h1{margin:0;font-size:46px;line-height:1;font-weight:700;letter-spacing:.02em}
.card h2{margin:0;font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.sub{margin:0;color:var(--muted);font-size:16px;max-width:58ch;line-height:1.4}
.reason{margin:0;font-size:20px;line-height:1.3;max-width:50ch}
.stats{display:flex;gap:22px;flex-wrap:wrap}
.stats div{display:flex;flex-direction:column}
.stats b{font-family:var(--font-mono);font-size:20px;font-variant-numeric:tabular-nums}
.stats span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.keys{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:7px 16px;margin:0;font-size:14px;align-items:center}
.keys dt{display:flex;gap:4px;flex-wrap:wrap}
.keys dd{margin:0;color:var(--muted)}
kbd{font-family:var(--font-mono);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 6px;background:rgba(255,255,255,.07);color:var(--text)}
.tips{margin:0;padding:12px 14px;border-left:3px solid var(--accent);background:rgba(255,179,71,.08);font-size:14px;line-height:1.45;color:var(--text)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;font-size:15px;letter-spacing:.04em;padding:11px 18px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;flex:1 1 150px;text-align:left}
.opt small{font-weight:500;color:var(--muted);font-size:12px;letter-spacing:0}
.opt.on{border-color:var(--accent);background:rgba(255,179,71,.16)}
.mapcol{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#mm{width:148px;height:148px;border-radius:50%;padding:0}
#apinfo{text-align:right}
@media (max-width:560px){#mm{width:112px;height:112px}}
.btn:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.btn:disabled,.btn:disabled:hover{opacity:.5;cursor:not-allowed;filter:none}
.btn small{font-weight:500;color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-left:6px}
#lock{position:absolute;left:0;top:0;width:58px;height:58px;margin:-29px 0 0 -29px;border:2px dashed var(--accent);border-radius:4px;pointer-events:none;color:var(--accent);font:700 12px var(--font-mono)}
#lock span{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:4px;white-space:nowrap;letter-spacing:.1em}
#lock.on{border-style:solid;border-color:var(--warn);color:var(--warn)}
#pip{position:absolute;left:0;top:0;width:14px;height:14px;margin:-7px 0 0 -7px;border:2px solid var(--accent);border-radius:50%;opacity:.85;pointer-events:none}
.btn:hover{filter:brightness(1.08)}
.kbnote{display:none;margin:0;color:var(--warn);font-size:14px}
@media (pointer:coarse){.kbnote{display:block}}
@media (max-width:560px){
  .reads{gap:12px;padding:8px 10px}
  .read b{font-size:20px}
  .read{min-width:48px}
  #ai{width:96px;height:96px}
  .card h1{font-size:38px}
}
#overlay.menu{padding:0;background:linear-gradient(90deg,rgba(6,14,20,.94) 0%,rgba(6,14,20,.8) 36%,rgba(6,14,20,.22) 64%,rgba(6,14,20,0) 80%),linear-gradient(0deg,rgba(6,14,20,.6),rgba(6,14,20,0) 38%)}
.home{width:min(600px,100%);box-sizing:border-box;min-height:100%;display:flex;flex-direction:column;justify-content:flex-start;gap:clamp(10px,1.7vh,16px);
  padding-block:clamp(28px,6vh,56px);padding-left:max(clamp(16px,4vw,52px),env(safe-area-inset-left,0px));padding-right:clamp(16px,3vw,36px)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}
.brand{margin:0;font-size:clamp(56px,10vw,104px);line-height:.88;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.rwy{height:4px;width:min(340px,70%);background:repeating-linear-gradient(90deg,var(--accent) 0 28px,transparent 28px 46px)}
.tagline{margin:0;color:var(--muted);font-size:16px;line-height:1.4;max-width:46ch}
.home h2{margin:6px 0 0}
.fleet{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ac{font:inherit;color:var(--text);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:12px;border:1px solid var(--line);border-radius:8px;background:rgba(10,22,30,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);min-width:0}
.ac:hover{border-color:rgba(255,179,71,.6)}
.ac.on{border-color:var(--accent);background:rgba(255,179,71,.14);box-shadow:0 0 0 1px var(--accent) inset}
.ac b{font-size:21px;line-height:1;letter-spacing:.02em}
.ac .t{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ac .m{font-family:var(--font-mono);font-size:11px;color:var(--muted);line-height:1.5}
.ac .m i{font-style:normal;color:var(--text)}
.meter{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.meter span{width:44px;flex:none}
.meter em{display:block;height:4px;border-radius:2px;background:rgba(255,255,255,.12);flex:1;position:relative;overflow:hidden}
.meter em::after{content:"";position:absolute;inset:0;width:var(--v);background:var(--accent);border-radius:2px}
.team{display:inline-block;margin-left:8px;padding:1px 6px;border-radius:3px;border:1px solid var(--tc);color:var(--tc);font:700 11px var(--font-mono);letter-spacing:.12em;vertical-align:middle}
.ac b .team{font-size:10px;margin-left:6px}
#net .tm{display:flex;justify-content:space-between;gap:10px;font-family:var(--font-mono);font-size:12px;line-height:1.5;border-top:1px solid var(--line);margin-top:4px;padding-top:4px}
.blurb{margin:0;min-height:2.6em;font-size:15px;line-height:1.35;color:var(--text)}
.btn.big{font-size:17px;padding:13px 24px}
.how{border-top:1px solid var(--line);padding-top:10px}
.how summary{cursor:pointer;font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.how[open] summary{color:var(--text)}
.how .tips{margin-top:12px}
.foot{margin:0;font-size:12px;color:var(--muted);letter-spacing:.06em}
.lnk{font:inherit;letter-spacing:.06em;background:none;border:0;border-bottom:1px solid transparent;color:var(--muted);cursor:pointer;padding:2px 6px;margin-left:2px}
.lnk.on{color:var(--accent);border-bottom-color:var(--accent)}
.lnk:hover{color:var(--text)}
@media (max-width:820px){
  #overlay.menu{background:linear-gradient(180deg,rgba(6,14,20,.55),rgba(6,14,20,.9) 45%)}
  .home{margin:0 auto}
}
@media (max-width:560px){
  .fleet{grid-template-columns:1fr}
  .ac{flex-direction:row;align-items:center;flex-wrap:wrap;gap:4px 12px}
  .ac .meter{display:none}
}

/* redesigned menu: numbered sections, fleet grouped by nation, 2v2 panel */
.home h2.sec{display:flex;align-items:center;gap:10px;margin:10px 0 0;font-size:12px;letter-spacing:.22em;color:var(--text)}
.home h2.sec::before{content:attr(data-n);font:700 11px var(--font-mono);letter-spacing:0;color:var(--accent-ink);background:var(--accent);border-radius:3px;padding:2px 6px}
.home h2.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.grp{display:flex;align-items:center;gap:8px;margin:4px 0 -2px;font-size:13px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gc,var(--text))}
.grp::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--gc,var(--muted))}
.grp small{font-weight:500;letter-spacing:.08em;color:var(--muted);font-size:11px}
.duelcard{display:flex;flex-direction:column;gap:12px;padding:16px;border:1px solid var(--line);border-radius:10px;background:linear-gradient(90deg,rgba(210,57,43,.2),rgba(10,22,30,.6) 50%,rgba(42,127,216,.2));-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.vs{display:flex;align-items:center;justify-content:center;gap:16px;font-weight:700;letter-spacing:.08em}
.vs .side{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:22px}
.vs .side small{font:500 11px var(--font-display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.vs .x{font:700 13px var(--font-mono);color:var(--muted);border:1px solid var(--line);border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center}
.steps{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.steps li{font-size:13px;line-height:1.35;color:var(--muted);padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:rgba(10,22,30,.4)}
.steps li b{display:block;color:var(--text);font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:2px}
.sub2{margin:0;font-size:13px;color:var(--muted);line-height:1.4}
@media (max-width:560px){.steps{grid-template-columns:1fr}.vs .side{font-size:18px}}
/* multiplayer: lobby form, name tags, scoreboard + feed */
.lobby{display:flex;flex-direction:column;gap:10px}
.lobby .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.lobby label{display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.lobby input{font:600 16px var(--font-mono);letter-spacing:.04em;color:var(--text);background:rgba(10,22,30,.55);border:1px solid var(--line);border-radius:6px;padding:9px 11px;min-width:0;text-transform:none}
.lobby input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.mpmsg{margin:0;min-height:1.3em;font-size:14px;color:var(--accent)}
.mpnote{margin:0;font-size:12px;color:var(--muted);line-height:1.4;max-width:52ch}
#tags{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.tag{position:absolute;left:0;top:0;display:none;font:600 12px var(--font-mono);color:#fff;white-space:nowrap;padding:1px 7px;border-radius:3px;background:rgba(10,22,30,.6);text-shadow:0 1px 2px #000}
#net{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:62px;width:min(230px,46vw);display:flex;flex-direction:column;gap:6px;pointer-events:none;font-size:12px}
#net .box{padding:7px 10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#net .hd{letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
#net .hd b{font-family:var(--font-mono);color:var(--text);letter-spacing:0}
#net .pl{display:flex;justify-content:space-between;gap:10px;font-family:var(--font-mono);font-size:12px;line-height:1.5}
#net .pl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#net .pl.me{color:var(--accent)}
#net .feed{color:var(--muted);line-height:1.5}
@media (max-width:560px){#net{top:52px;width:min(190px,50vw)}}
#chat{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:132px;width:min(360px,78vw);display:flex;flex-direction:column;gap:6px;pointer-events:none;font-size:13px;z-index:5}
#chatlog{display:flex;flex-direction:column;gap:2px;max-height:150px;overflow:hidden;justify-content:flex-end}
#chatlog div{padding:3px 8px;background:var(--panel);border-radius:5px;line-height:1.35;word-break:break-word;transition:opacity .6s}
#chatlog div.old{opacity:0}
#chat.open #chatlog{overflow-y:auto;pointer-events:auto;max-height:230px;justify-content:flex-start}
#chat.open #chatlog div.old{opacity:1}
#chatlog b{font-family:var(--font-mono);font-size:12px;margin-right:6px}
#chatlog .own{display:inline-block;margin-right:6px;padding:0 5px;border-radius:3px;background:#e3a52b;color:#1a1204;font:700 10px var(--font-mono);letter-spacing:.12em;vertical-align:1px}
#chatbtn{pointer-events:auto;align-self:flex-start;font:inherit;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#chatbtn:hover{border-color:var(--accent)}
#chatbtn b{font-family:var(--font-mono);color:var(--accent);margin-left:6px}
#chat.open #chatbtn{display:none}
#chatin{pointer-events:auto;font:inherit;color:var(--text);padding:8px 10px;background:var(--panel);border:1px solid var(--accent);border-radius:6px;outline:none;width:100%;box-sizing:border-box}
@media (max-width:560px){#chat{bottom:150px}}
/* 2v2 duel status bar */
#duel{position:absolute;left:50%;top:58px;transform:translateX(-50%);max-width:min(620px,94vw);padding:7px 14px;text-align:center;font-size:14px;letter-spacing:.05em;white-space:nowrap;pointer-events:none;color:var(--text)}
#duel b{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
@media (max-width:560px){#duel{top:100px;font-size:12px;white-space:normal}}
</style>

<script>
(function(){
'use strict';

/*PHYS-BEGIN*/
const V3=THREE.Vector3, Qn=THREE.Quaternion;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const approach=(v,t,s)=>v<t?Math.min(v+s,t):Math.max(v-s,t);

const RWY_Y=12, WATER_Y=-3, CELL=80, RWY_HALF_W=22, RWY_HALF_L=610;
const AIRPORTS=[{x:0,z:0,name:'Lowfly Field',tag:'L'},{x:0,z:-4000,name:'Northfield',tag:'N'}];   // both runways run north-south
function noise(x,z){
  return Math.sin(x*0.0023+Math.cos(z*0.0017)*2.0)*0.5
       + Math.sin(z*0.0031-x*0.0013+1.7)*0.3
       + Math.sin(x*0.0067+z*0.0059)*0.15
       + Math.sin(x*0.013-z*0.011+2.0)*0.06;
}
function rawHeight(x,z){
  let m=1;
  for(let k=0;k<AIRPORTS.length;k++){const a=AIRPORTS[k], dz=Math.max(0,Math.abs(z-a.z)-650); m=Math.min(m,smooth(330,950,Math.hypot(x-a.x,dz)));}
  const v=noise(x,z)+0.12;
  const h=v>0?330*Math.pow(v,1.35):70*v;
  return (1-m)*RWY_Y+m*Math.max(h,-30);
}
const vh=(i,j)=>rawHeight(i*CELL,j*CELL);
/* Collision uses the same triangles the terrain mesh draws, so wheels sit on what you see. */
function terrainTri(x,z){
  const gx=x/CELL, gz=z/CELL, ix=Math.floor(gx), iz=Math.floor(gz), fx=gx-ix, fz=gz-iz;
  const h00=vh(ix,iz), h10=vh(ix+1,iz), h01=vh(ix,iz+1), h11=vh(ix+1,iz+1);
  if(fx+fz<=1) return h00+fx*(h10-h00)+fz*(h01-h00);
  return h11+(1-fx)*(h01-h11)+(1-fz)*(h10-h11);
}
let gWater=false;
function groundAt(x,z){
  const h=terrainTri(x,z);
  gWater=h<WATER_Y;
  if(gWater) return WATER_Y;
  if(onRunway(x,z)) return Math.max(h,RWY_Y+0.12);
  return h;
}
/* paved areas relative to each airport origin: [x0,x1,z0,z1] - runway, parallel taxiway, connectors, terminal apron, hangar apron */
const PAVED=[[-RWY_HALF_W,RWY_HALF_W,-RWY_HALF_L,RWY_HALF_L],[70,86,-560,560],[22,70,-568,-552],[22,70,-258,-242],[22,70,292,308],[22,70,552,568],[86,206,180,440],[-112,-22,310,400]];
function onRunway(x,z){
  for(let k=0;k<AIRPORTS.length;k++){
    const a=AIRPORTS[k], rx=x-a.x, rz=z-a.z;
    if(rx<-112||rx>206||rz<-610||rz>610) continue;
    for(let i=0;i<PAVED.length;i++){const r=PAVED[i]; if(rx>r[0]&&rx<r[1]&&rz>r[2]&&rz<r[3]) return true;}
  }
  return false;
}

    pos.push(a[0],a[1],a[2],b[0],b[1],b[2],c[0],c[1],c[2]);

}
function hexa(v,m){return solid(v,HEXA,m);}
/* tapered, swept wing panel. side=+1/-1; x0,x1 are distances from the centreline, zLE the leading-edge z, c the chord, yb the underside, t the thickness */
function wingPanel(side,x0,zLE0,c0,x1,zLE1,c1,yb0,yb1,t0,t1,m){
  const X0=side*x0, X1=side*x1;
  return hexa([[X0,yb0,zLE0],[X0,yb0,zLE0+c0],[X1,yb1,zLE1+c1],[X1,yb1,zLE1],
               [X0,yb0+t0,zLE0],[X0,yb0+t0,zLE0+c0],[X1,yb1+t1,zLE1+c1],[X1,yb1+t1,zLE1]],m);
}
/* thin vertical fin: base and top given as [yb,zLE,zTE] / [yt,zLE,zTE] */
function finPanel(half,b,t,m){
  const A=-half, B=half;
  return hexa([[A,b[0],b[1]],[A,b[0],b[2]],[A,t[0],t[2]],[A,t[0],t[1]],[B,b[0],b[1]],[B,b[0],b[2]],[B,t[0],t[2]],[B,t[0],t[1]]],m);
}
function lathe(prof,seg,m){                // prof: [radius, y] from tail (low y) to nose (high y); the nose ends up pointing to -Z
  const o=new THREE.Mesh(lp(new THREE.LatheGeometry(prof.map(function(a){return new THREE.Vector2(a[0],a[1]);}),seg)),m);
  o.rotation.x=-Math.PI/2; return o;
}
function cyl(r0,r1,len,seg,m,x,y,z){      // cylinder along Z
  const o=mesh(new THREE.CylinderGeometry(r0,r1,len,seg),m,x,y,z); o.rotation.x=Math.PI/2; return o;
}
function hingeAt(parent,x,y,z){const h=new THREE.Group(); h.position.set(x,y,z); parent.add(h); return h;}
function addWheel(g,m,x,y,z,r,w){const o=mesh(new THREE.CylinderGeometry(r,r,w,10),m,x,y,z); o.rotation.z=Math.PI/2; g.add(o);}

/* street lamp: pole, arm over the road, lamp head, and a glow sprite. side +1 = left of travel, -1 = right; lat = pole distance from the road centre. */

let rdX=1e9, rdZ=1e9;
function rebuildRoads(cx,cz){
  rdX=cx; rdZ=cz; roadAsph.n=0; roadLine.n=0; lampN=0;
  Object.keys(stopIM).forEach(function(k){stopIM[k].count=0;});
  Object.keys(brIM).forEach(function(k){brIM[k].count=0;});
  Object.keys(lampIM).forEach(function(k){lampIM[k].count=0;});
  eachRoad(cx,cz,RD_R,function(pf,s0,s1,o){
    const DH=0.3+(o.ns?0:0.04), S=[];
    for(let s=Math.floor(s0/RD_STEP)*RD_STEP;s<=s1;s+=RD_STEP){
      const q=pf(s), q2=pf(s+1), x=q[0], z=q[1];
      let tx=q2[0]-x, tz=q2[1]-z; const tl=Math.hypot(tx,tz)||1; tx/=tl; tz/=tl;
      const px=tz*ROAD_HW, pz=-tx*ROAD_HW, h=terrainTri(x,z);
      const lx=x+px, lz=z+pz, rx=x-px, rz=z-pz, hl=terrainTri(lx,lz), hr=terrainTri(rx,rz);
      const apOk=o.spur||!nearAirport(x,z,10);
      const ok=h>WATER_Y+0.8&&hl>WATER_Y+0.3&&hr>WATER_Y+0.3&&h<165&&Math.abs(hl-hr)<4&&apOk;
      const wet=!ok&&apOk&&h<165&&(h<=WATER_Y+0.8||hl<=WATER_Y+0.3||hr<=WATER_Y+0.3);
      S.push({x:x,z:z,h:h,lx:lx,lz:lz,rx:rx,rz:rz,hl:hl,hr:hr,ok:ok,wet:wet,br:false,s:s,tx:tx,tz:tz,px:px,pz:pz,
        xr:(o.ns?nearEW(x,z,12):nearNS(x,z,12)), xe:(o.ns?nearEW(x,z,8):nearNS(x,z,8))});
    }
    const runs=markBridges(S,BR_MAXRUN,RD_STEP);
    for(let i=1;i<S.length;i++){
      const prev=S[i-1], cur=S[i], x=cur.x, z=cur.z, h=cur.h, tx=cur.tx, tz=cur.tz, s=cur.s;
      if(!(cur.ok&&prev.ok&&Math.abs(h-prev.h)<=1.9)) continue;

      roadSeg(prev,cur,DH,near);

        if(!prev.xr&&cur.xr) stopLineQ(prev,0.3,ROAD_HW-0.6,DH);
        else if(prev.xr&&!cur.xr) stopLineQ(cur,-(ROAD_HW-0.6),-0.3,DH);

      if(!o.spur){
        const m=((s%1200)+1200)%1200;
        if(m===300||m===900){
          const side=(Math.floor(s/600)&1)?1:-1, nx=tz*side, nz=-tx*side, th=Math.atan2(tx,tz);
          const cs=Math.abs(terrainTri(x+nx*9,z+nz*9)-h), ls=Math.abs(terrainTri(x+tx*8,z+tz*8)-terrainTri(x-tx*8,z-tz*8));
          if(cs<1.0&&ls<0.9&&terrainTri(x+nx*9,z+nz*9)>WATER_Y+1) addBusStop(x,z,h,th,side);

      if(((s/RD_STEP)%8)===0&&!cur.xr) addLamp(x,z,undefined,tx,tz,Math.atan2(tx,tz),(Math.floor(s/80)&1)?1:-1,6.0);   // a lamp every 80 m, alternating sides
    }
    runs.forEach(function(r){ buildBridge(S,r[0],r[1],DH); });

  Object.keys(brIM).forEach(function(k){brIM[k].instanceMatrix.needsUpdate=true;});
  Object.keys(lampIM).forEach(function(k){lampIM[k].instanceMatrix.needsUpdate=true;});
  lampGeo.setDrawRange(0,lampN); lampGeo.attributes.position.needsUpdate=true;
}

/* trees and vegetation: instanced meshes on a world-fixed jittered grid around the camera, rebuilt as the camera travels.

const TS=40, TR=1900;
function treeInst(geo,cap){
  const m=new THREE.InstancedMesh(lp(geo),new THREE.MeshLambertMaterial({color:0xffffff}),cap);

function rebuildTrees(cx,cz){
  trX=cx; trZ=cz; trunks.count=0; cones.count=0; blobs.count=0;
  const i0=Math.floor((cx-TR)/TS), i1=Math.ceil((cx+TR)/TS), j0=Math.floor((cz-TR)/TS), j1=Math.ceil((cz+TR)/TS), R2=TR*TR;
  for(let j=j0;j<=j1;j++) for(let i=i0;i<=i1;i++){
    const r1=hash2(i*1.7+3.1,j*2.3-1.9), r2=hash2(i+11.3,j*0.7+5.1), r3=hash2(i*0.3-7.7,j+2.9);
    const x=(i+0.15+0.7*r2)*TS, z=(j+0.15+0.7*r3)*TS, dx=x-cx, dz=z-cz;
    if(dx*dx+dz*dz>R2) continue;
    const f=Math.sin(x*0.0041+Math.sin(z*0.0023)*2)*Math.sin(z*0.0037-x*0.0019+1.3)+0.4*Math.sin(x*0.011+z*0.009);
    const dens=f>0.15?0.85:(f>-0.2?0.22:0.06);
    if(r1>dens) continue;
    let near=false;
    for(let k=0;k<AIRPORTS.length;k++){const a=AIRPORTS[k]; if(Math.abs(x-a.x)<300&&Math.abs(z-a.z)<880){near=true;break;}}
    if(near) continue;
    if(roadNear(x,z,22)) continue;                                                         // keep the roads and bus stops clear
    const h=terrainTri(x,z);
    if(h<1.5||h>175) continue;
    if(Math.abs(rawHeight(x+12,z)-rawHeight(x-12,z))>16||Math.abs(rawHeight(x,z+12)-rawHeight(x,z-12))>16) continue;
    const r4=hash2(i*5.1+0.5,j*3.7-4.2), r5=hash2(i*9.3-2.2,j*1.1+8.8), ry=r5*6.283, j2=r4-0.5;
    if(h<9){

      else put(blobs,x,h+0.6,z,1.3+r5,0.9+r4*0.5,1.3+r5,0x5f9440,ry,j2);

    }else{
      const hill=smooth(60,150,h), pine=(r5<0.25+0.7*hill)||Math.sin(x*0.0021+z*0.0033)<-0.2;
      if(pine){
        const H=11+r4*12;
        put(trunks,x,h-0.2,z,0.9,H*0.35,0.9,0x5b4330,ry);
        put(cones,x,h+H*0.16,z,H*0.36,H*0.58,H*0.36,0x2f6b3d,ry,j2);
        put(cones,x,h+H*0.5,z,H*0.25,H*0.5,H*0.25,0x3a7a45,ry,j2);
      }else{

        put(blobs,x,h+H+1.8*s,z,4.6*s,3.9*s,4.6*s,0x5e9a46,ry,j2*2);
        if(r5>0.5) put(blobs,x+1.6*s,h+H+0.6*s,z+1.1*s,3*s,2.6*s,3*s,0x74a843,ry,j2*2);
      }

function updateDebris(dt){
  for(let i=0;i<debris.length;i++){
    const d=debris[i], v=d.userData.v;
    if(v.lengthSq()<0.01&&d.userData.rest) continue;
    v.y-=9.8*dt; d.position.addScaledVector(v,dt);
    d.rotation.x+=d.userData.s.x*dt; d.rotation.y+=d.userData.s.y*dt; d.rotation.z+=d.userData.s.z*dt;
    const gh=groundAt(d.position.x,d.position.z)+0.15;

function readInputs(dt){
  const k=c=>keys.has(c);

  const r=((k('KeyD')||k('ArrowRight'))?1:0)-((k('KeyA')||k('ArrowLeft'))?1:0);
  const y=(k('KeyE')?1:0)-(k('KeyQ')?1:0);
  ctl.pitch=approach(ctl.pitch,p*0.5,(p?2:4)*dt);
  ctl.roll=approach(ctl.roll,r*0.7,(r?3:5)*dt);
  ctl.yaw=approach(ctl.yaw,y*0.8,(y?3:5)*dt);
  ctl.brake=k('Space')||k('KeyB');
  if(k('KeyR')) st.thr=clamp(st.thr+0.5*dt,0,1);
  if(k('KeyF')) st.thr=clamp(st.thr-0.5*dt,0,1);

  applyAssists(dt,r);
}

const aR=new V3(), aU=new V3();
function assistHtml(){ return '<div class="row">'+ASSISTS.map(function(a){ return '<button class="btn ghost opt'+(A[a[0]]?' on':'')+'" data-act="as-'+a[0]+'"><b>'+a[1]+'</b> <kbd>'+a[2]+'</kbd></button>'; }).join('')+'</div>'; }
function assistTag(){ const t=ASSISTS.filter(function(a){ return A[a[0]]; }).map(function(a){ return a[2]; }).join(' '); return t?' · '+t:''; }
function toggleAssist(k){
  A[k]=A[k]?0:1; if(k==='spd'){ A.tgt=st.speed; A.athr=-1; }
  try{ localStorage.setItem('lowfly-assist',JSON.stringify({lvl:A.lvl,stall:A.stall,gpws:A.gpws})); }catch(e){}

function applyAssists(dt,r){
  if(st.onGround){ A.athr=-1; return; }
  aR.set(1,0,0).applyQuaternion(st.q); aU.set(0,1,0).applyQuaternion(st.q);
  if(A.lvl&&!r&&aU.y>0.25) ctl.roll=clamp(2*aR.y+0.5*st.w.z,-0.5,0.5);          // no roll input: bring the wings level and damp the roll rate
  if(A.stall){                                                                  // ease off the stick near the stall, nose down if it gets close
    if(st.alpha>0.7*A_STALL&&ctl.pitch>0) ctl.pitch*=clamp((0.9*A_STALL-st.alpha)/(0.2*A_STALL),0,1);
    if(st.alpha>0.9*A_STALL) ctl.pitch=Math.min(ctl.pitch,0);
  }
  if(A.gpws){                                                                   // same trigger as the PULL UP warning
    const agl=st.pos.y-GH-groundAt(st.pos.x,st.pos.z);
    if(st.vel.y<-12*VNE/90&&agl<250*VNE/90){ ctl.pitch=Math.max(ctl.pitch,0.5); if(aU.y>0.25) ctl.roll=clamp(2*aR.y+0.5*st.w.z,-0.5,0.5); st.thr=clamp(st.thr+dt,0,1); }
  }
  if(A.spd){
    if(A.athr>=0&&Math.abs(st.thr-A.athr)>1e-4){ A.spd=0; A.athr=-1; }          // you touched the throttle: hand it back
    else{ st.thr=clamp(st.thr+clamp((A.tgt-st.speed)*0.03,-0.5,0.5)*dt,0,1); A.athr=st.thr; }
  }
}

/* puffs: smoke, muzzle flash and explosions share one ring-buffer pool */
const smokeM=new THREE.MeshBasicMaterial({color:0xd8dde0,transparent:true,opacity:0.6,depthWrite:false});
const fireM=new THREE.MeshBasicMaterial({color:0xffa03a,transparent:true,opacity:0.9,depthWrite:false});
const fxGeo=new THREE.IcosahedronGeometry(1,0), fxPool=[]; let fxI=0;
for(let i=0;i<240;i++){ const m=new THREE.Mesh(fxGeo,smokeM); m.visible=false; scene.add(m); fxPool.push({m:m,life:0,max:1,a:1,b:1}); }
const fxTmp=new V3();
function fx(p,fire,a,b,life){
  const o=fxPool[fxI]; fxI=(fxI+1)%fxPool.length;
  o.m.material=fire?fireM:smokeM; o.m.position.copy(p); o.life=life; o.max=life; o.a=a; o.b=b; o.m.scale.setScalar(a); o.m.visible=true;
}
function explode(p,size){
  for(let k=0;k<5;k++){ fxTmp.set(p.x+(Math.random()-0.5)*size*0.5,p.y+(Math.random()-0.5)*size*0.5,p.z+(Math.random()-0.5)*size*0.5); fx(fxTmp,true,size*0.3,size,0.55+Math.random()*0.2); }
  for(let k=0;k<5;k++){ fxTmp.set(p.x+(Math.random()-0.5)*size,p.y+(Math.random()-0.5)*size*0.6,p.z+(Math.random()-0.5)*size); fx(fxTmp,false,size*0.4,size*1.5,1.6+Math.random()*0.8); }
}
function updateFx(dt){
  for(let i=0;i<fxPool.length;i++){
    const o=fxPool[i]; if(!o.m.visible) continue;
    o.life-=dt; if(o.life<=0){ o.m.visible=false; continue; }
    const t=1-o.life/o.max;
    o.m.scale.setScalar((o.a+(o.b-o.a)*t)*(1-0.7*t*t));
    if(o.m.material===smokeM) o.m.position.y+=dt*2;
  }
}

/* target drones: orbit fixed circles, respawn after being shot down */
const TGT_CFG=[[300,-900,700,420,65],[-1100,-1800,900,560,80],[1000,-2300,800,380,70],[-300,-3200,700,500,75],[1400,-4200,900,640,85],[-1400,-5000,800,450,70],[900,1100,900,560,75],[-1300,-100,800,620,70]];
const tgtBodyM=pm(0xf2a03d,50), tgtWingM=pm(0xf2f2ee,40), tgtTailM=pm(0xc8372d,40);
const targets=TGT_CFG.map(function(c,i){
  const g=new THREE.Group();
  const body=mesh(new THREE.IcosahedronGeometry(1,1),tgtBodyM,0,0,0); body.scale.set(2.2,2.2,5.5); g.add(body);
  g.add(mesh(new THREE.BoxGeometry(15,0.35,2.8),tgtWingM,0,0.2,0.4));
  g.add(mesh(new THREE.BoxGeometry(5.5,0.3,1.6),tgtWingM,0,0.2,4.6));
  g.add(mesh(new THREE.BoxGeometry(0.3,3.2,1.8),tgtTailM,0,1.8,4.6));
  g.add(mesh(new THREE.BoxGeometry(0.4,0.4,9),tgtTailM,0,3.2,0.5));
  scene.add(g);
  return {g:g,cx:c[0],cz:c[1],rad:c[2],alt:c[3],spd:c[4],w:c[4]/c[2],a:i*0.9,alive:true,hp:100,rs:0,pos:new V3(c[0]+c[2],c[3],c[1]),v:new V3()};
});
function updateTargets(dt){
  for(let i=0;i<targets.length;i++){
    const t=targets[i];
    if(!t.alive){ t.rs-=dt; if(t.rs<=0){ t.alive=true; t.hp=100; t.g.visible=true; } continue; }
    if(net.on) t.a=i*0.9+((serverNow()/1000)*t.w)%(Math.PI*2);   // online: orbit angle comes from the shared server clock, so every pilot sees the drones in the same place
    else t.a+=t.w*dt;
    const s=Math.sin(t.a), c=Math.cos(t.a);
    t.pos.set(t.cx+c*t.rad, t.alt+Math.sin(t.a*0.7)*30, t.cz+s*t.rad);
    t.v.set(-s*t.spd,0,c*t.spd);
    t.g.position.copy(t.pos); t.g.rotation.y=Math.atan2(-t.v.x,-t.v.z);
  }
}
function killTarget(t,fromNet){
  t.alive=false; t.rs=10; t.g.visible=false;
  explode(t.pos,16);
  if(!fromNet){ kills++; netSend({t:'kill',i:targets.indexOf(t)}); }   // tell the room so the drone disappears for everybody
}

/* weapon state */
let hull=100, spawnProt=0, lastHitBy='', lastHitT=0, wasFiring=false, fireSent=0, incoming=false, smkT=0;
const PD_GUN=7, PD_MSL=60;
let gunLeft=0, mslLeft=0, droneLeft=0, droneT=0, kills=0, gunT=0, gunIdx=0, lockT=0, lockTgt=null, lockR=0;
const msls=[];
const wV=new V3(), wF=new V3(), wR=new V3(), wD=new V3(), wA=new V3(), sd1=new V3(), sd2=new V3();
function segDist2(a,b,c){
  sd1.subVectors(b,a); const l2=sd1.lengthSq(); let t=0;
  if(l2>1e-9){ sd2.subVectors(c,a); t=clamp(sd2.dot(sd1)/l2,0,1); }
  sd2.copy(a).addScaledVector(sd1,t); return sd2.distanceToSquared(c);
}
function resetWeapons(){
  const W=WEAPONS[planeIdx];
  hull=100; spawnProt=net.on?4:0; lastHitBy=''; wasFiring=false; incoming=false;
  gunLeft=W.ammo; mslLeft=W.msl.length; droneLeft=W.drones||0; droneT=0; kills=0; gunT=0; gunIdx=0; lockT=0; lockTgt=null;
  bullets.length=0; bulletIM.count=0; bulletIM.instanceMatrix.needsUpdate=true; trails.length=0; trailIM.count=0;
  while(msls.length){ scene.remove(msls.pop().g); }
  for(let i=0;i<fxPool.length;i++) fxPool[i].m.visible=false;
  pylons.forEach(function(ps){ ps.forEach(function(m){ m.visible=true; }); });
  if(!net.on) targets.forEach(function(t){ t.alive=true; t.hp=100; t.g.visible=true; });   // online, drones are shared: only kills/respawn timers change them
}
const hurtEl=$('hurt');
function hurtFlash(){ hurtEl.style.opacity='1'; setTimeout(function(){ hurtEl.style.opacity='0'; },120); }
const meProxy={get pos(){return st.pos;},get v(){return st.vel;},get alive(){return mode==='play';}};
function sameTeam(r){ const a=PLANES[planeIdx].team, b=r.pl>=0?PLANES[r.pl].team:undefined; return !!a&&a===b; }
function duelCanHit(r){ const a=duel.team, b=duel.teams[r.id]||null; if(!a&&!b) return true; return !!a&&!!b&&duel.ph==='live'&&a!==b; }   // same rule as the server
function peerLive(r){ return r.group.visible&&!r.dead&&r.pl>=0&&!sameTeam(r)&&duelCanHit(r); }
function peerRad(r){ return PLANES[r.pl].SPAN*0.5+2; }
function lockList(){ const L=targets.slice(); if(net.on) net.peers.forEach(function(r){ if(peerLive(r)) L.push(r.tgt); }); return L; }
function takeHit(d,from){
  if(mode!=='play'||spawnProt>0) return;
  hull-=d/(PLANES[planeIdx].armor||1); lastHitBy=from; lastHitT=performance.now(); hurtFlash();
  if(hull<=0){ const r=net.peers.get(from); onCrash('Shot down by '+(r?r.name:'another pilot')+'.'); }
}
function onNetMissile(m){
  if(!net.on||!Array.isArray(m.p)||!Array.isArray(m.v)) return;
  const W=WEAPONS[m.pl|0]||WEAPONS[0], dr=!!m.dr, g=dr?makeDrone():makeMissile(W.ms,true);
  let tgt=null;
  if(m.tp&&m.tp===net.id) tgt=meProxy; else if(m.tp&&net.peers.get(m.tp)) tgt=net.peers.get(m.tp).tgt; else if((m.td|0)>=0&&targets[m.td|0]) tgt=targets[m.td|0];
  const o={g:g,p:new V3(num(m.p[0]),num(m.p[1]),num(m.p[2])),pp:new V3(),v:new V3(num(m.v[0]),num(m.v[1]),num(m.v[2])),tgt:tgt,age:0,smk:0,rem:true,maxS:0,dr:dr?1:0};
  o.maxS=dr?Math.max(170,o.v.length()+40):Math.max(320,o.v.length()+180); scene.add(g); g.position.copy(o.p); msls.push(o);
}
function fireGun(W){
  const gp=W.guns[gunIdx++%W.guns.length];
  const b={p:new V3(gp[0],gp[1],gp[2]).applyQuaternion(st.q).add(st.pos),pp:new V3(),v:new V3(),l:2.2};
  wF.set(0,0,-1).applyQuaternion(st.q);
  b.v.copy(st.vel).addScaledVector(wF,GUN_V);
  b.v.x+=(Math.random()-0.5)*3; b.v.y+=(Math.random()-0.5)*3; b.v.z+=(Math.random()-0.5)*3;
  if(bullets.length>=BMAX) bullets.shift();
  bullets.push(b); gunLeft--;
  fx(b.p,true,0.5*W.ms+0.3,1.1*W.ms+0.6,0.07);
}
function fireMissile(){
  if(mode!=='play'||mslLeft<=0) return;
  const W=WEAPONS[planeIdx], slot=W.msl.length-mslLeft; mslLeft--;
  pylons[planeIdx][slot].visible=false;
  const sp=W.msl[slot], g=makeMissile(W.ms,true);
  const m={g:g,p:new V3(sp[0],sp[1]-0.3+(HOVER?1.2:0),sp[2]).applyQuaternion(st.q).add(st.pos),pp:new V3(),v:new V3(),
    tgt:(lockTgt&&lockT>=LOCK_T)?lockTgt:null,age:0,smk:0,maxS:Math.max(320,st.vel.length()+180)};
  wF.set(0,0,-1).applyQuaternion(st.q);
  m.v.copy(st.vel).addScaledVector(wF,30); m.v.y+=HOVER?20:-3;   // the hovercraft sits 1.4 m up, so its missiles are kicked upward to clear the ground
  scene.add(g); g.position.copy(m.p); msls.push(m);
  if(net.on) netSend({t:'m',pl:planeIdx,p:[m.p.x,m.p.y,m.p.z],v:[m.v.x,m.v.y,m.v.z],tp:(m.tgt&&m.tgt.peer)?m.tgt.peer.id:'',td:(m.tgt&&!m.tgt.peer)?targets.indexOf(m.tgt):-1});
}
function endMissile(i){ scene.remove(msls[i].g); msls[i]=msls[msls.length-1]; msls.pop(); }
/* attack drones (Mothership, key N): small homing craft. They reuse the missile list: slower, tighter turns, longer life, 22 damage each. */
const drnBodyM=pm(0x7a2d8c,50), drnWingM=pm(0xdfe3e6,40), drnGlowM=new THREE.MeshBasicMaterial({color:0xff7ad9});
const drnBodyG=new THREE.IcosahedronGeometry(1,0), drnWingG=new THREE.BoxGeometry(6,0.15,1.6), drnFinG=new THREE.BoxGeometry(0.15,1.4,1.2), drnGlowG=new THREE.ConeGeometry(0.35,1.6,6);
drnGlowG.rotateX(Math.PI/2); drnGlowG.translate(0,0,2.1);
function makeDrone(){
  const g=new THREE.Group(), b=new THREE.Mesh(drnBodyG,drnBodyM); b.scale.set(0.7,0.55,2.0); g.add(b);
  const w=new THREE.Mesh(drnWingG,drnWingM); w.position.z=0.5; g.add(w);
  const f=new THREE.Mesh(drnFinG,drnBodyM); f.position.set(0,0.7,1.5); g.add(f);
  g.add(new THREE.Mesh(drnGlowG,drnGlowM));
  g.scale.setScalar(1.5); return g;
}
function nearestTarget(maxR){
  const LK=lockList(); let best=null, bd=maxR*maxR;
  for(let i=0;i<LK.length;i++){ const t=LK[i]; if(!t.alive) continue; const d=t.pos.distanceToSquared(st.pos); if(d<bd){ bd=d; best=t; } }
  return best;
}
function nearestTargetFrom(p,maxR){
  const LK=lockList(); let best=null, bd=maxR*maxR;
  for(let i=0;i<LK.length;i++){ const t=LK[i]; if(!t.alive) continue; const d=t.pos.distanceToSquared(p); if(d<bd){ bd=d; best=t; } }
  return best;
}
function fireDrone(){
  const W=WEAPONS[planeIdx];
  if(mode!=='play'||!W.drones||droneLeft<=0||droneT>0) return;
  const bp=W.bay[droneLeft%W.bay.length]; droneLeft--; droneT=1.2;
  const tgt=(lockTgt&&lockT>=LOCK_T)?lockTgt:nearestTarget(3500);      // the locked target, else the nearest hostile
  const m={g:makeDrone(),p:new V3(bp[0],bp[1],bp[2]).applyQuaternion(st.q).add(st.pos),pp:new V3(),v:new V3(),tgt:tgt,age:0,smk:0,dr:1,maxS:Math.max(170,st.vel.length()+40)};
  wF.set(0,0,-1).applyQuaternion(st.q);
  m.v.copy(st.vel).addScaledVector(wF,25); m.v.y-=10;
  scene.add(m.g); m.g.position.copy(m.p); msls.push(m);
  if(net.on) netSend({t:'m',pl:planeIdx,dr:1,p:[m.p.x,m.p.y,m.p.z],v:[m.v.x,m.v.y,m.v.z],tp:(tgt&&tgt.peer)?tgt.peer.id:'',td:(tgt&&!tgt.peer)?targets.indexOf(tgt):-1});
}
function updateWeapons(dt){
  const W=WEAPONS[planeIdx];
  incoming=false;
  if(mode==='play'){
    gunT-=dt; droneT-=dt;
    { const fn=(keys.has('KeyG')||keys.has('Mouse0'))&&gunLeft>0, nowT=performance.now(); if(fn!==wasFiring||(fn&&nowT-fireSent>1000)){ wasFiring=fn; fireSent=nowT; netSend({t:'f',on:fn?1:0}); } }
    if(spawnProt>0) spawnProt-=dt;
    if(hull<55){ smkT-=dt; if(smkT<=0){ smkT=0.05; fx(st.pos,false,1,3.5,1.2); } }
    if((keys.has('KeyG')||keys.has('Mouse0'))&&gunLeft>0){
      const iv=1/W.rate;
      while(gunT<=0&&gunLeft>0){ gunT+=iv; fireGun(W); }
    }else gunT=Math.max(gunT,0);
    /* lock-on: best target inside a 25 degree cone ahead */
    wF.set(0,0,-1).applyQuaternion(st.q);
    let best=null, bs=0.9063, br=0;
    const LK=lockList();
    for(let i=0;i<LK.length;i++){
      const t=LK[i]; if(!t.alive) continue;
      wR.subVectors(t.pos,st.pos); const r=wR.length();
      if(r>40&&r<LOCK_RANGE){ const c=wR.dot(wF)/r; if(c>bs){ bs=c; best=t; br=r; } }
    }
    if(best&&best===lockTgt) lockT=Math.min(lockT+dt,LOCK_T+0.01); else { lockTgt=best; lockT=0; }
    lockR=br;
  }else{ lockTgt=null; lockT=0; }

  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.pp.copy(b.p); b.v.y-=9.81*dt; b.p.addScaledVector(b.v,dt); b.l-=dt;
    let dead=b.l<=0;
    if(!dead&&!b.rem){
      for(let k=0;k<targets.length;k++){
        const t=targets[k]; if(!t.alive) continue;
        if(segDist2(b.pp,b.p,t.pos)<64){ t.hp-=12; fx(b.p,true,1.2,3,0.15); dead=true; if(t.hp<=0) killTarget(t); break; }
      }
      if(!dead&&net.on){
        for(const r of net.peers.values()){
          if(!peerLive(r)) continue;
          const R=peerRad(r);
          if(segDist2(b.pp,b.p,r.group.position)<R*R){ fx(b.p,true,1.2,3,0.15); dead=true; netSend({t:'hit',to:r.id,d:PD_GUN,w:0}); break; }
        }
      }
    }
    if(!dead&&b.p.y<groundAt(b.p.x,b.p.z)){ dead=true; fx(b.p,false,0.8,2.5,0.5); }
    if(dead){ bullets[i]=bullets[bullets.length-1]; bullets.pop(); }
  }
  for(let i=0;i<bullets.length;i++){
    const b=bullets[i];
    bDir.copy(b.v).normalize();
    bDummy.position.copy(b.p); bDummy.quaternion.setFromUnitVectors(WZ,bDir); bDummy.updateMatrix();
    bulletIM.setMatrixAt(i,bDummy.matrix);
  }
  bulletIM.count=bullets.length; bulletIM.instanceMatrix.needsUpdate=true;

  for(let i=msls.length-1;i>=0;i--){
    const m=msls[i];
    m.age+=dt; m.pp.copy(m.p);
    if(m.rem&&m.tgt===meProxy&&m.p.distanceToSquared(st.pos)<9e6) incoming=true;
    const sp0=Math.max(m.v.length(),1);
    let sp=m.dr?clamp(sp0+40*dt,40,m.maxS):clamp(sp0+(m.age<4?140*dt:-8*dt),60,m.maxS);
    wD.copy(m.v).multiplyScalar(1/sp0);
    if(m.tgt&&m.tgt.alive&&m.age>0.3){
      wR.subVectors(m.tgt.pos,m.p); const r=wR.length();
      wA.copy(m.tgt.pos).addScaledVector(m.tgt.v,Math.min(r/sp,6)*0.8).sub(m.p).normalize();
      const ang=Math.acos(clamp(wD.dot(wA),-1,1));
      if(ang>1e-4){ wR.crossVectors(wD,wA); if(wR.lengthSq()>1e-10){ wR.normalize(); wD.applyAxisAngle(wR,Math.min(ang,(m.dr?3.2:2.6)*dt)); } }
    }
    m.v.copy(wD).multiplyScalar(sp); if(!m.dr) m.v.y-=9.81*dt;
    m.p.addScaledVector(m.v,dt);
    m.g.position.copy(m.p); m.g.quaternion.setFromUnitVectors(WZ,wD.copy(m.v).normalize());
    if(m.dr&&!(m.tgt&&m.tgt.alive)) m.tgt=m.rem?null:nearestTargetFrom(m.p,3000);   // a drone whose target died looks for another (your own drones only; remote copies just follow what you see)
    m.smk-=dt; if(m.smk<=0&&m.age<(m.dr?25:5)){ m.smk=0.04; wR.copy(wD).multiplyScalar(-2).add(m.p); fx(wR,false,0.5,1.8,1.2); }
    let boom=false;
    if(m.age>(m.dr?1.2:0.25)){
      const HIT2=m.dr?64:256, PRAD=m.dr?3:8, BOOM=m.dr?5:9;
      if(m.rem){
        if(m.tgt&&m.tgt.alive&&segDist2(m.pp,m.p,m.tgt.pos)<HIT2){ explode(m.p,BOOM); boom=true; }
      }else{
        for(let k=0;k<targets.length;k++){
          const t=targets[k]; if(!t.alive) continue;
          if(segDist2(m.pp,m.p,t.pos)<HIT2){ t.hp=0; killTarget(t); explode(m.p,BOOM); boom=true; break; }
        }
        if(!boom&&net.on){
          for(const r of net.peers.values()){
            if(!peerLive(r)) continue;
            const R=peerRad(r)+PRAD;
            if(segDist2(m.pp,m.p,r.group.position)<R*R){ explode(m.p,BOOM); boom=true; netSend({t:'hit',to:r.id,d:m.dr?PD_DRN:PD_MSL,w:m.dr?2:1}); break; }
          }
        }
      }
      if(!boom&&m.p.y<groundAt(m.p.x,m.p.z)){ explode(m.p,m.dr?5:9); boom=true; }
    }
    if(boom||m.age>(m.dr?30:12)){ if(!boom) fx(m.p,false,1,4,1); endMissile(i); }
  }
  updateFx(dt);
}

/* lock box and gun pipper, projected onto the screen */
const lockEl=$('lock'), pipEl=$('pip'), lkV=new V3(), lkF=new V3();
function updateLockUI(){
  if(mode!=='play'){ lockEl.hidden=true; pipEl.hidden=true; return; }
  const w=canvas.clientWidth||window.innerWidth, h=canvas.clientHeight||window.innerHeight;
  camera.updateMatrixWorld();
  lkF.set(0,0,-1).applyQuaternion(st.q);
  lkV.copy(st.pos).addScaledVector(lkF,700).project(camera);
  if(lkV.z<1){ pipEl.hidden=false; pipEl.style.transform='translate('+((lkV.x*0.5+0.5)*w).toFixed(1)+'px,'+((-lkV.y*0.5+0.5)*h).toFixed(1)+'px)'; } else pipEl.hidden=true;
  if(lockTgt){
    lkV.copy(lockTgt.pos).project(camera);
    if(lkV.z<1){
      const locked=lockT>=LOCK_T;
      lockEl.hidden=false; lockEl.className=locked?'on':'';
      lockEl.style.transform='translate('+((lkV.x*0.5+0.5)*w).toFixed(1)+'px,'+((-lkV.y*0.5+0.5)*h).toFixed(1)+'px)';
      lockEl.lastElementChild.textContent=(locked?'LOCK ':'')+(lockR/1000).toFixed(1)+' km';
      return;
    }
  }
  lockEl.hidden=true;
}

/* ================= Multiplayer =================
   Every client flies its own plane and sends its state ~15 times a second to a room on the server (see src/worker.js),
   which forwards it to the other pilots. Remote planes are drawn INTERP_MS in the past, blended between the last two
   snapshots, so network jitter doesn't show. Clocks are synced to the server so drones and snapshots share one timeline. */
const SLOT_COL=[0xd2392b,0x1b7fd1,0x2fa36b,0xe3a52b,0x8e4fc7,0x1fb3b3,0xe06a9f,0x6f7a84];
const SEND_HZ=15, INTERP_MS=150, MAXP=8;
const MAKERS=[makeSkylark,makeJetliner,makeFighter,makeSu35,makeF18,makeF16,makeMothership,makeHovercraft,makeJ20,makeBus];
const hex6=n=>'#'+n.toString(16).padStart(6,'0');
const dispCol=function(slot,pl){ const t=pl>=0&&PLANES[pl].team; return t?TEAMS[t].col:SLOT_COL[slot%SLOT_COL.length]; };   // team colour for team aircraft, slot colour otherwise
const net={on:false,joining:false,ws:null,id:'',slot:0,room:'',name:'',offset:0,bestRtt:1e9,rtt:0,peers:new Map(),sendT:0,pingT:0,hudT:0,feed:[]};
const lobby={name:'',room:'',msg:''};
function randRoom(){ const a='ABCDEFGHJKLMNPQRSTUVWXYZ'; let s=''; for(let i=0;i<4;i++) s+=a[Math.floor(Math.random()*a.length)]; return s; }
try{ lobby.name=localStorage.getItem('lowfly-name')||''; lobby.room=localStorage.getItem('lowfly-room')||''; }catch(e){}
if(!lobby.name) lobby.name='Pilot'+(100+Math.floor(Math.random()*900));
if(!lobby.room) lobby.room=randRoom();
const cleanRoom=()=>'SKY';   // one room for everyone
const cleanName=s=>(String(s||'').replace(/[^\w \-.]/g,'').trim().slice(0,16))||'Pilot';
const OWNER_CODE='098';                                                        // put 098 in your pilot name: chat shows an OWNER badge and the code itself is hidden
const hasOwner=s=>String(s||'').indexOf(OWNER_CODE)>=0;
const ownerStrip=s=>cleanName(String(s||'').split(OWNER_CODE).join(''));
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
const serverNow=()=>Date.now()+net.offset;
const tagBox=$('tags'), netBox=$('net');
const num=x=>(typeof x==='number'&&isFinite(x))?x:0;

/* ================= 2v2 duel (client side; the room in src/worker.js runs the queue, teams, planes, clock and score) =================
   Flow: you queue ("duel","q"). When the server starts a match it sends a 'duel' snapshot that lists every pilot's team and plane.
   If you are in it, you are put in that plane at your team's home airfield and respawn there after a crash until time is up.
   Damage between pilots is only allowed between opposing duel teams, and only while the match is live (the server enforces it too). */
const DUEL_START='air';                      // 'air' = start in the air near your home field, 'ground' = on the runway
const TKEYS=['RUS','USA'];
const duel={snap:null,team:null,no:-1,ph:'idle',teams:{},queue:[],score:{RUS:0,USA:0},hudT:0,html:''};
const duelBox=$('duel');
function duelReset(){ duel.snap=null; duel.team=null; duel.no=-1; duel.ph='idle'; duel.teams={}; duel.queue=[]; duel.score={RUS:0,USA:0}; duel.html=''; duelBox.hidden=true; duelBox.innerHTML=''; }
function duelEnter(team,pl){
  if(!(pl>=0&&pl<PLANES.length&&PLANES[pl].team===team)) pl=PLANES.findIndex(function(p){ return p.team===team; });
  if(chatOpen) chatClose();
  planeIdx=pl; startAp=TEAMS[team].home; applyLook(); startFlight(DUEL_START);
  feedPush('2v2: you fly the '+PLANES[pl].name+' for '+TEAMS[team].name);
}
function duelApply(s){
  if(!s||s.t!=='duel'||typeof s.ph!=='string') return;
  const teams={}, planes={};
  if(s.teams&&typeof s.teams==='object') for(const id in s.teams){ if(TKEYS.indexOf(s.teams[id])>=0){ teams[id]=s.teams[id]; planes[id]=(s.planes&&s.planes[id])|0; } }
  const prev={ph:duel.ph,team:duel.team,no:duel.no,score:duel.score};
  const myT=teams[net.id]||null, no=num(s.no)|0, sc={RUS:(num(s.score&&s.score.RUS))|0,USA:(num(s.score&&s.score.USA))|0};
  duel.snap=s; duel.ph=s.ph; duel.teams=teams; duel.score=sc; duel.hudT=0; duel.team=myT; duel.no=no;
  duel.queue=Array.isArray(s.queue)?s.queue.filter(function(x){ return typeof x==='string'; }):[];
  if(s.ph==='live'&&prev.ph!=='live') feedPush('2v2 match started');
  else if(s.ph==='over'&&prev.ph!=='over') feedPush('2v2 over: '+((s.win==='RUS'||s.win==='USA')?TEAMS[s.win].name+' wins':'draw'));
  else if(s.ph==='live') TKEYS.forEach(function(k){ if(sc[k]>prev.score[k]) feedPush(TEAMS[k].name+' scores'); });
  if(myT&&(myT!==prev.team||no!==prev.no)) duelEnter(myT,planes[net.id]);
  else if(!myT&&prev.team) feedPush('2v2 finished: back to free flight');
  if(!overlay.hidden&&mode==='play'&&net.on&&overlay.innerHTML.indexOf('data-act="leave"')>=0) showPauseMP();   // keep the open menu's duel section current
}
function fmtMs(ms){ return fmtTime(Math.max(0,Math.ceil(ms/1000))); }
function tcol(k){ return '<b style="color:'+TEAMS[k].css+'">'+TEAMS[k].short+'</b>'; }
function duelLine(){
  const s=duel.snap; if(!net.on||!s) return null;
  const me=duel.team, q=duel.queue.indexOf(net.id)>=0, left=num(s.t1)-serverNow(), sc=duel.score, nq=duel.queue.length;
  const board=tcol('RUS')+' <b>'+sc.RUS+'</b> &ndash; <b>'+sc.USA+'</b> '+tcol('USA');
  if(s.ph==='live') return '2v2 live <b>'+fmtMs(left)+'</b> &middot; '+board+(me?' &middot; you fly for '+tcol(me):(q?' &middot; queued, you join when a seat opens':' &middot; P to queue'));
  if(s.ph==='over') return '2v2 over &middot; '+(s.win==='draw'?'<b>Draw</b>':(s.win==='RUS'||s.win==='USA')?tcol(s.win)+' <b>wins</b>':'<b>Finished</b>')+' &middot; '+board+(s.why==='forfeit'?' (forfeit)':'');
  if(s.ph==='forming') return '2v2 starting in <b>'+fmtMs(left)+'</b> &middot; '+nq+' queued'+(q?'':' &middot; P to join');
  return q?'2v2 &middot; waiting for another pilot ('+nq+' queued)':null;
}
function duelHtml(){
  if(!net.on) return '';
  const q=duel.queue.indexOf(net.id)>=0;
  const b=duel.team?'<button class="btn ghost" data-act="dx">Leave the match</button>':q?'<button class="btn ghost" data-act="dx">Leave the queue</button>':'<button class="btn" data-act="dq">Queue for 2v2 (Russia vs USA)</button>';
  return '<h2>2v2 duel</h2><p class="sub">'+(duelLine()||'No match running. Queue up: with two or more pilots waiting, the server forms the teams and starts a 5 minute match.')+'</p><div class="row">'+b+'</div>';
}
function duelTick(dt){
  duel.hudT-=dt; if(duel.hudT>0) return; duel.hudT=0.25;
  const L=(net.on&&(mode==='play'||mode==='crashed'))?duelLine():null;
  if(!L){ duelBox.hidden=true; duel.html=''; return; }
  if(L!==duel.html){ duelBox.innerHTML=L; duel.html=L; }
  duelBox.hidden=false;
}

function netUrl(room,name){
  let base=new URLSearchParams(location.search).get('server')||'';             // ?server=my-worker.example.workers.dev overrides the host
  if(!base){
    if(location.protocol!=='http:'&&location.protocol!=='https:') return null;   // opened as a local file: there is no server to talk to
    base=(location.protocol==='https:'?'wss://':'ws://')+location.host;
  }else if(!/^wss?:\/\//.test(base)) base='wss://'+base;
  return base.replace(/\/+$/,'')+'/ws?room='+encodeURIComponent(room)+'&name='+encodeURIComponent(name);
}
function rawSend(o){ if(net.ws&&net.ws.readyState===1) net.ws.send(JSON.stringify(o)); }
function netSend(o){ if(net.on) rawSend(o); }
function netPing(){ rawSend({t:'ping',c:Date.now()}); }
function feedPush(s){ net.feed.push({t:performance.now(),s:s}); if(net.feed.length>5) net.feed.shift(); net.hudT=0; }

function netConnect(url,room,name){
  return new Promise(function(resolve,reject){
    let ws, done=false;
    try{ ws=new WebSocket(url); }catch(e){ reject(new Error('Could not open a connection.')); return; }
    net.ws=ws;
    const fail=function(msg){ if(done) return; done=true; clearTimeout(timer); try{ws.close();}catch(e){} if(net.ws===ws) net.ws=null; reject(new Error(msg)); };
    const timer=setTimeout(function(){ fail('Timed out. Is the server running?'); },8000);
    ws.onerror=function(){ fail('Could not reach the server.'); };
    ws.onclose=function(ev){ if(!done) fail(ev.reason||'The server closed the connection.'); else if(net.ws===ws) netLost(); };
    ws.onmessage=function(ev){
      let m; try{ m=JSON.parse(ev.data); }catch(e){ return; }
      if(!done){
        if(m.t==='error') fail(m.msg||'The server refused the connection.');
        else if(m.t==='hello'){
          done=true; clearTimeout(timer);
          net.id=m.id; net.slot=m.slot|0; net.room=room; net.name=ownerStrip(name); net.bestRtt=1e9; net.offset=num(m.now)-Date.now();
          net.peers.forEach(function(r,id){ removePeer(id); });
          (m.players||[]).forEach(function(p){ addPeer(p.id,p.name,p.slot); });
          chatLoadHistory(m.chat);
          net.on=true; net.sendT=0; net.pingT=0; net.feed.length=0; duelApply(m.duel);
          for(let i=0;i<6;i++) setTimeout(netPing,i*180);                       // a few quick pings to find the server clock offset
          resolve();
        }
        return;
      }
      netHandle(m);
    };
  });
}
function netHandle(m){
  switch(m.t){
    case 's': onState(m); break;
    case 'duel': duelApply(m); break;
    case 'pong': {
      const now=Date.now(), rtt=now-num(m.c); net.rtt=rtt;
      if(rtt<=net.bestRtt+8){ net.bestRtt=Math.min(net.bestRtt,rtt); net.offset=num(m.s)+rtt/2-now; }   // trust the lowest-latency sample
      break; }
    case 'join': { const r=addPeer(m.id,m.name,m.slot); feedPush(dn(r)+' joined'); break; }
    case 'fr': {
      const r=net.peers.get(m.f); if(!r||(m.to&&m.to!==net.id)) break;
      if(m.k==='req'){ if(isFr(r.name)) netSend({t:'fr',to:m.f,k:'acc'}); else{ fr.inc.set(m.f,r.name); feedPush(r.name+' sent a friend request (P to answer)'); } }
      else if(m.k==='acc'&&fr.out.has(m.f)){ fr.out.delete(m.f); if(!isFr(r.name)){ FR.push(r.name); saveFr(); } feedPush(r.name+' accepted your friend request'); }
      break; }
    case 'leave': { const r=net.peers.get(m.id); if(r){ feedPush(r.name+' left'); removePeer(m.id); } break; }
    case 'dead': {
      const r=net.peers.get(m.f); if(!r||r.dead) break;
      if(r.group.visible){ explode(r.group.position,12); spawnDebris(r.group.position,r.vel); }
      r.dead=true; r.firing=false; r.buf.length=0; r.group.visible=false;
      { const by=m.by?net.peers.get(m.by):null;
        if(m.by&&m.by===net.id){ kills++; feedPush('You shot down '+r.name); }
        else if(by) feedPush(r.name+' was shot down by '+by.name);
        else feedPush(r.name+' crashed'); }
      break; }
    case 'f': { const r=net.peers.get(m.f); if(r){ r.firing=!!m.on; r.fireT=Date.now(); if(!m.on) r.gunT=0; } break; }
    case 'm': onNetMissile(m); break;
    case 'chat': if(typeof m.x==='string') chatAdd(cleanName(m.n),m.x,hex6(SLOT_COL[(m.s|0)%SLOT_COL.length]),true,m.o); break;
    case 'hit': if(m.to===net.id) takeHit(clamp(num(m.d),0,60),m.f); break;
    case 'kill': {
      const t=targets[m.i|0], r=net.peers.get(m.f);
      if(t&&t.alive){ killTarget(t,true); feedPush((r?r.name:'Someone')+' shot down a drone'); }
      break; }
  }
}
function netLost(){
  if(!net.on) return;
  netLeave(); lobby.msg='Connection to the room was lost.';
  if(mode!=='menu') act('menu'); else showMenu();
}
function netLeave(){
  const ws=net.ws; net.on=false; net.joining=false; net.ws=null; mpSlot=0;
  if(ws){ ws.onclose=null; ws.onmessage=null; ws.onerror=null; try{ ws.close(1000,'leave'); }catch(e){} }
  Array.from(net.peers.keys()).forEach(removePeer);
  net.feed.length=0; tagBox.innerHTML=''; netBox.hidden=true; netBox.innerHTML=''; duelReset();
  applyLook();
}
async function joinOnline(kind,wantDuel){
  if(net.joining||net.on) return;
  const name=cleanName(lobby.name), room=cleanRoom(lobby.room), msgEl=$('mpMsg');
  lobby.name=name; lobby.room=room;
  try{ localStorage.setItem('lowfly-name',name); localStorage.setItem('lowfly-room',room); }catch(e){}
  const url=netUrl(room,name);
  if(!url){ lobby.msg='Open the game from your deployed web address to play online (it cannot connect when opened as a file).'; showMenu(); return; }
  net.joining=true; lobby.msg='Connecting to room '+room+'…'; if(msgEl) msgEl.textContent=lobby.msg;
  try{ await netConnect(url,room,name); }
  catch(err){ net.joining=false; lobby.msg=err.message||'Could not connect.'; showMenu(); return; }
  net.joining=false; lobby.msg=''; kills=0;
  startFlight(kind);
  if(wantDuel) netSend({t:'duel',k:'q'});
}

/* ---- chat: Enter opens the box, Enter sends, Esc closes. The room keeps the last messages on the server and sends them
   to you when you join; a copy is also kept in this browser so the box is never empty. ---- */
const CHAT_MAX=60, chatBox=$('chat'), chatLog=$('chatlog'), chatIn=$('chatin');
let chatMsgs=[], chatOpen=false;
try{ chatMsgs=JSON.parse(localStorage.getItem('lowfly-chat')||'[]').filter(function(m){ return m&&typeof m.x==='string'; }).slice(-CHAT_MAX); }catch(e){ chatMsgs=[]; }
function chatSave(){ try{ localStorage.setItem('lowfly-chat',JSON.stringify(chatMsgs.slice(-CHAT_MAX))); }catch(e){} }
function chatRender(){
  const now=Date.now();
  chatLog.innerHTML=chatMsgs.map(function(m){
    const old=!chatOpen&&(now-(m.recv||0)>10000);
    return '<div'+(old?' class="old"':'')+'>'+(m.o?'<span class="own">OWNER</span>':'')+'<b style="color:'+(m.c||'#ffb347')+'">'+esc(m.n)+'</b>'+esc(m.x)+'</div>';
  }).join('');
  chatBox.classList.toggle('open',chatOpen);
  chatBox.hidden=!(chatOpen||mode==='play'||mode==='crashed');
  if(chatOpen) chatLog.scrollTop=chatLog.scrollHeight;
}
function chatAdd(n,x,c,live,o){
  chatMsgs.push({n:String(n).slice(0,16),x:String(x).slice(0,120),c:c,o:o?1:0,recv:live?Date.now():0});
  if(chatMsgs.length>CHAT_MAX) chatMsgs.shift();
  chatSave(); chatRender();
  if(live) setTimeout(chatRender,10700);
}
function chatLoadHistory(h){
  chatMsgs=(Array.isArray(h)?h:[]).slice(-CHAT_MAX).map(function(m){ return {n:cleanName(m.n),x:String(m.x||'').slice(0,120),c:hex6(SLOT_COL[(m.s|0)%SLOT_COL.length]),o:m.o?1:0,recv:0}; });
  chatSave(); chatRender();
}
function chatOpenBox(){
  if(chatOpen||(mode!=='play'&&mode!=='crashed')) return;
  chatOpen=true; keys.clear(); chatIn.hidden=false; chatIn.value=''; chatRender(); setTimeout(function(){ chatIn.focus(); },0);
}
function chatClose(){ chatOpen=false; chatIn.hidden=true; chatIn.blur(); chatRender(); }
$('chatbtn').addEventListener('click',function(){ chatOpenBox(); });
chatIn.addEventListener('keydown',function(e){
  e.stopPropagation();
  if(e.code==='Enter'||e.key==='Enter'){
    e.preventDefault(); const txt=chatIn.value.replace(/\s+/g,' ').trim().slice(0,120);
    if(txt){
      if(net.on) rawSend({t:'chat',x:txt});                                   // the room echoes it back to everyone, me included
      else chatAdd(ownerStrip(lobby.name),txt,hex6(SLOT_COL[0]),true,hasOwner(lobby.name));        // offline: just saved in this browser
    }
    chatClose();
  }else if(e.code==='Escape'||e.key==='Escape'){ e.preventDefault(); chatClose(); }
});
chatIn.addEventListener('keyup',function(e){ e.stopPropagation(); });

let chatT=0;
function chatTick(dt){ if(chatOpen&&mode!=='play') chatClose(); chatT-=dt; if(chatT<=0){ chatT=0.5; if(!chatOpen) chatRender(); } }

/* remote pilots */
function addPeer(id,name,slot){
  let r=net.peers.get(id);
  if(!r){
    r={id:id,name:cleanName(name),slot:slot|0,pl:-1,group:new THREE.Group(),model:null,mats:null,buf:[],dead:false,k:0,last:0,ang:0,vel:new V3(),tag:document.createElement('div'),tagTxt:'',firing:false,fireT:0,gunT:0,gi:0,tgt:null};
    r.tgt={peer:r,get pos(){return r.group.position;},get v(){return r.vel;},get alive(){return r.group.visible&&!r.dead;}};
    r.group.visible=false; scene.add(r.group);
    r.tag.className='tag'; tagBox.appendChild(r.tag);
    net.peers.set(id,r);
  }else{
    if(name) r.name=cleanName(name);
    if(slot!==undefined&&(slot|0)!==r.slot){ r.slot=slot|0; if(r.pl>=0) setPeerPlane(r,r.pl); }
  }
  return r;
}
function disposeModel(r){
  if(!r.model) return;
  r.group.remove(r.model.g);
  r.model.g.traverse(function(o){ if(o.isMesh&&o.geometry) o.geometry.dispose(); });
  if(r.mats){ r.mats.body.dispose(); r.mats.acc.dispose(); r.mats.tip.dispose(); }
  r.model=null; r.mats=null;
}
function setPeerPlane(r,pl){
  disposeModel(r);
  const P=PLANES[pl]; r.pl=pl;
  r.mats=fixedMats(P.body,dispCol(r.slot,pl),P.tip);
  const S=MAKERS[pl](r.mats);
  S.g.traverse(function(o){ if(o.isMesh) o.castShadow=true; });
  if(S.glow) S.glow.traverse(function(o){ o.castShadow=false; });
  addNav(S,pl);
  r.group.add(S.g); r.model=S;
}
function removePeer(id){
  const r=net.peers.get(id); if(!r) return;
  fr.inc.delete(id); fr.out.delete(id);
  disposeModel(r); scene.remove(r.group); r.tag.remove(); net.peers.delete(id);
}
function onState(m){
  if(!Array.isArray(m.p)||!Array.isArray(m.q)||!Array.isArray(m.v)||typeof m.pl!=='number'||m.pl<0||m.pl>=PLANES.length) return;
  const r=net.peers.get(m.f)||addPeer(m.f,'Pilot',0);
  if(r.pl!==(m.pl|0)) setPeerPlane(r,m.pl|0);
  if(r.dead){ r.dead=false; r.buf.length=0; }
  r.k=m.k|0; r.last=serverNow();
  r.buf.push({ts:num(m.ts),px:num(m.p[0]),py:num(m.p[1]),pz:num(m.p[2]),qx:num(m.q[0]),qy:num(m.q[1]),qz:num(m.q[2]),qw:num(m.q[3]),
    vx:num(m.v[0]),vy:num(m.v[1]),vz:num(m.v[2]),th:clamp(num(m.th),0,1),e:clamp(num(m.e),-1,1),r:clamp(num(m.r),-1,1),y:clamp(num(m.y),-1,1)});
  if(r.buf.length>40) r.buf.shift();
}
const rq1=new Qn(), rq2=new Qn(), rgv=new V3();
function remoteGun(r,dt){
  const W=WEAPONS[r.pl]; if(!W) return;
  if(Date.now()-r.fireT>2500){ r.firing=false; return; }       // lost the "stop" message: don't fire forever
  r.gunT-=dt; const iv=1/W.rate; let n=0;
  while(r.gunT<=0&&n++<4){
    r.gunT+=iv; const gp=W.guns[(r.gi++)%W.guns.length];
    const b={p:new V3(gp[0],gp[1],gp[2]).applyQuaternion(r.group.quaternion).add(r.group.position),pp:new V3(),v:new V3(),l:2.2,rem:true};
    rgv.set(0,0,-1).applyQuaternion(r.group.quaternion);
    b.v.copy(r.vel).addScaledVector(rgv,GUN_V); b.v.x+=(Math.random()-0.5)*3; b.v.y+=(Math.random()-0.5)*3; b.v.z+=(Math.random()-0.5)*3;
    if(bullets.length>=BMAX) bullets.shift();
    bullets.push(b); fx(b.p,true,0.5*W.ms+0.3,1.1*W.ms+0.6,0.07);
  }
}
function updateRemotes(dt){
  const nowS=serverNow(), t=nowS-INTERP_MS, ph=performance.now()/1000;
  net.peers.forEach(function(r){
    const b=r.buf, M=r.model;
    if(r.dead||!M||b.length===0||nowS-r.last>4000){ r.group.visible=false; return; }        // silent for 4 s: hide rather than leave a ghost
    while(b.length>3&&b[2].ts<=t) b.shift();
    const n=b.length, last=b[n-1];
    let px,py,pz,th,e,ro,ya;
    if(t>=last.ts){                                                                        // ran out of snapshots: dead-reckon from the newest one
      const d=Math.min((t-last.ts)/1000,0.5);
      px=last.px+last.vx*d; py=last.py+last.vy*d; pz=last.pz+last.vz*d; th=last.th; e=last.e; ro=last.r; ya=last.y;
      rq1.set(last.qx,last.qy,last.qz,last.qw);
    }else if(t<=b[0].ts){
      const a=b[0]; px=a.px; py=a.py; pz=a.pz; th=a.th; e=a.e; ro=a.r; ya=a.y; rq1.set(a.qx,a.qy,a.qz,a.qw);
    }else{
      let i=0; while(i<n-2&&b[i+1].ts<=t) i++;
      const a=b[i], c=b[i+1], k=(t-a.ts)/Math.max(1,c.ts-a.ts);
      px=lerp(a.px,c.px,k); py=lerp(a.py,c.py,k); pz=lerp(a.pz,c.pz,k);
      th=lerp(a.th,c.th,k); e=lerp(a.e,c.e,k); ro=lerp(a.r,c.r,k); ya=lerp(a.y,c.y,k);
      rq1.set(a.qx,a.qy,a.qz,a.qw); rq2.set(c.qx,c.qy,c.qz,c.qw); rq1.slerp(rq2,k);
    }
    r.vel.set(last.vx,last.vy,last.vz);
    r.group.position.set(px,py,pz); r.group.quaternion.copy(rq1).normalize(); r.group.visible=true;
    if(r.firing) remoteGun(r,dt);
    M.elev.rotation.x=-M.ek*e; M.ailR.rotation.x=-0.5*ro/0.7; M.ailL.rotation.x=0.5*ro/0.7; M.rud.rotation.y=-0.45*ya/0.8;

let orbitA=0.6;
function updateCamera(dt){
  const P=PLANES[planeIdx];

    plane.visible=true; setFov(48); orbitA+=dt*0.16;
    camera.up.set(0,1,0);
    camera.position.set(st.pos.x+Math.sin(orbitA)*P.orb[0],st.pos.y+P.orb[1]+Math.sin(orbitA*0.7)*1.5,st.pos.z+Math.cos(orbitA)*P.orb[0]);

    if(camera.position.y<floor) camera.position.y=floor;
    tmpUp.set(0,1,0).applyQuaternion(camQ);
    upv.set(0,1,0).lerp(tmpUp,0.45).normalize();
    camera.up.copy(upv);
    look.set(0,1,P.cam[3]).applyQuaternion(camQ).add(st.pos);
    camera.lookAt(look);
  }
  scene.userData.sky.position.copy(camera.position);

  if(Math.hypot(camera.position.x-rdX,camera.position.z-rdZ)>300) rebuildRoads(camera.position.x,camera.position.z);

    if(c.position.z-camera.position.z>4500) c.position.z-=9000; else if(c.position.z-camera.position.z<-4500) c.position.z+=9000;
  }
}

  const w=canvas.clientWidth||window.innerWidth, h=canvas.clientHeight||window.innerHeight;

  if(mode!=='paused') updateTrails(dt);

  syncPlane(dt); updateCamera(dt); updateLockUI(); updateHud(); updateTags(); updateNetHud(dt); duelTick(dt); chatTick(dt);
  renderer.render(scene,camera);
}

setPlane(planeIdx); applyLook(); resetState('ground'); resetWeapons();
updateTerrain(Math.round(st.pos.x/CELL),Math.round(st.pos.z/CELL));
snapCamera(); resize(); showMenu();
requestAnimationFrame(function(t){last=t; frame(t);});
})();
